[package]
name = "zch"
version = "3.0.0"
edition = "2024"
repository = "https://github.com/prsweet/zch"
description = "Codeforces and competitive programming TUI for the Zed editor: import problems from Competitive Companion, run tests with diffs, and submit from the terminal"
homepage = "https://github.com/prsweet/zch"
readme = "README.md"
license = "MIT"
keywords = ["codeforces", "competitive-programming", "tui", "zed", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/graphify-out", "/.github", "/.claude", "CLAUDE.md", "plans.md"]

[dependencies]
base64 = "0.22"
color-eyre = "0.6.5"
derive-name = "1.1.0"
dirs = "6.0.0"
duct = "1.1.1"
ratatui = "0.30.0"
ratatui-textarea = { version = "0.9.2", features = ["crossterm"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
throbber-widgets-tui = "0.11.1"
tiny_http = "0.12.0"
unicode-width = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
portable-pty = "0.9"
